openapi: 3.1.0
info:
  title: Green Way Motors API
  version: 0.3.0
  description: Implemented backend contract. GreenWay_Backend_Master_Spec_v1.md is the product and API roadmap.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: Health
  - name: Markets
  - name: Catalog
  - name: Vehicles
  - name: Auth
  - name: Uploads
  - name: Admin - Inventory Sources
  - name: Admin - Vehicles
  - name: Admin - Markets
  - name: Admin - Costing
  - name: Sales - Leads
  - name: Sales - Follow-ups
  - name: Sales - Quotes
  - name: Sales - Reservations
  - name: Sales - Deals
  - name: Sales - Fulfillment
  - name: RBAC
  - name: Admin - Staff
  - name: Admin - Audit
  - name: Admin - Dashboard
  - name: Admin - Reports
  - name: Admin - Content
  - name: Admin - Catalog
  - name: Admin - Vehicle Imports
  - name: Customer Account
  - name: Notifications
  - name: Content
paths:
  /health/live:
    get:
      tags:
        - Health
      operationId: getLiveness
      responses:
        '200':
          description: API process is alive.
  /health/ready:
    get:
      tags:
        - Health
      operationId: getReadiness
      responses:
        '200':
          description: Required dependencies are available.
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/countries:
    get:
      tags:
        - Markets
      operationId: listCountries
      responses:
        '200':
          description: Active countries.
  /api/v1/markets:
    get:
      tags:
        - Markets
      operationId: listMarkets
      responses:
        '200':
          description: Active destination markets and countries.
  /api/v1/markets/{marketSlug}:
    get:
      tags:
        - Markets
      operationId: getMarket
      parameters:
        - name: marketSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active destination market metadata.
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/catalog/makes:
    get:
      tags:
        - Catalog
      operationId: listMakes
      responses:
        '200':
          description: Active makes.
  /api/v1/catalog/models:
    get:
      tags:
        - Catalog
      operationId: listModels
      parameters:
        - name: makeId
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Active models.
  /api/v1/catalog/makes/{makeId}/models:
    get:
      tags:
        - Catalog
      operationId: listModelsForMake
      parameters:
        - name: makeId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Active models for a make.
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/catalog/body-types:
    get:
      tags:
        - Catalog
      operationId: listBodyTypes
      responses:
        '200':
          description: Vehicle body types.
  /api/v1/catalog/features:
    get:
      tags:
        - Catalog
      operationId: listFeatures
      responses:
        '200':
          description: Vehicle features.
  /api/v1/vehicles:
    get:
      tags:
        - Vehicles
      operationId: listPublishedVehicles
      parameters:
        - name: market
          in: query
          required: true
          description: Active destination market slug.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: makeId
          in: query
          schema:
            type: integer
        - name: modelId
          in: query
          schema:
            type: integer
        - name: bodyTypeId
          in: query
          schema:
            type: integer
        - name: condition
          in: query
          schema:
            type: string
            enum:
              - new
              - used
        - name: yearFrom
          in: query
          schema:
            type: integer
        - name: yearTo
          in: query
          schema:
            type: integer
        - name: mileageFrom
          in: query
          schema:
            type: integer
        - name: mileageTo
          in: query
          schema:
            type: integer
        - name: engineCcFrom
          in: query
          schema:
            type: integer
        - name: engineCcTo
          in: query
          schema:
            type: integer
        - name: fuel
          in: query
          description: Comma-separated or repeated enum values.
          schema:
            type: string
        - name: transmission
          in: query
          schema:
            type: string
        - name: drive
          in: query
          schema:
            type: string
        - name: steering
          in: query
          schema:
            type: string
        - name: stockCountryId
          in: query
          schema:
            type: integer
        - name: featureIds
          in: query
          description: Comma-separated feature IDs.
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - newest
              - oldest
              - year_desc
              - year_asc
              - mileage_asc
              - mileage_desc
      responses:
        '200':
          $ref: '#/components/responses/PublicVehicles'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/vehicles/{referenceNo}:
    get:
      tags:
        - Vehicles
      operationId: getPublishedVehicle
      parameters:
        - name: market
          in: query
          required: true
          description: Active destination market slug.
          schema:
            type: string
        - name: referenceNo
          in: path
          required: true
          schema:
            type: string
            pattern: ^GW-[0-9]+$
      responses:
        '200':
          $ref: '#/components/responses/PublicVehicle'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/customers/register:
    post:
      tags:
        - Auth
      operationId: registerCustomer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerInput'
      responses:
        '201':
          description: Customer registered; verification email delivery is initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Access JWT response and rotating HttpOnly refresh cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '202':
          description: Privileged staff must complete the second-factor challenge before a session is issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [mfaChallengeRequired, challengeToken, expiresAt]
                    properties:
                      mfaChallengeRequired:
                        const: true
                      challengeToken:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/mfa/challenge:
    post:
      tags: [Auth]
      operationId: completeMfaChallenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              additionalProperties: false
              properties:
                challengeToken:
                  type: string
                code:
                  type: string
                  pattern: '^(\d{6}|[A-Fa-f0-9]{12})$'
      responses:
        '200':
          description: MFA verified and a rotating refresh cookie plus MFA-satisfied access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshSession
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Rotated refresh cookie and new access JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      security:
        - bearerAuth: []
          refreshCookie: []
      responses:
        '200':
          description: Current refresh session revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout-all:
    post:
      tags:
        - Auth
      operationId: logoutAll
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All refresh sessions revoked.
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/email-verification/request:
    post:
      tags:
        - Auth
      operationId: requestEmailVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '200':
          description: Neutral success response to prevent account enumeration.
        '429':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/email-verification/confirm:
    post:
      tags:
        - Auth
      operationId: confirmEmailVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenInput'
      responses:
        '200':
          description: Email verified.
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/forgot:
    post:
      tags:
        - Auth
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '200':
          description: Neutral success response to prevent account enumeration.
        '429':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/reset:
    post:
      tags:
        - Auth
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordInput'
      responses:
        '200':
          description: Password reset and refresh sessions revoked.
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current sanitized user. Staff responses include effective permission codes for first-party capability rendering.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Problem'
    patch:
      tags:
        - Auth
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileInput'
      responses:
        '200':
          description: Current sanitized user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/me/mfa/enroll:
    post:
      tags: [Auth]
      operationId: enrollStaffMfa
      description: Creates a pending TOTP enrollment and returns the secret and otpauth URI once. The secret is encrypted at rest.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Enrollment secret. Confirm the authenticator code before this setup expires or can be used.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [secret, otpauthUrl]
                    properties:
                      secret:
                        type: string
                      otpauthUrl:
                        type: string
                        format: uri
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/me/mfa/confirm:
    post:
      tags: [Auth]
      operationId: confirmStaffMfa
      description: Verifies TOTP, enables MFA, revokes old refresh sessions, issues a verified session, and returns one-time recovery codes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: MFA activated. Recovery codes are shown once.
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/roles:
    get:
      tags:
        - RBAC
      operationId: listRoles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Roles with their permissions.
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags:
        - RBAC
      operationId: createRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '201':
          description: Role created and audited.
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/roles/{id}:
    patch:
      tags:
        - RBAC
      operationId: updateRole
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Role updated and audited.
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/permissions:
    get:
      tags:
        - RBAC
      operationId: listPermissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Permissions.
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/roles/{id}/permissions:
    put:
      tags:
        - RBAC
      operationId: replaceRolePermissions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionIdsInput'
      responses:
        '204':
          description: Role permissions replaced and audited.
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/users/{userId}/roles:
    put:
      tags:
        - RBAC
      operationId: replaceStaffUserRoles
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleIdsInput'
      responses:
        '204':
          description: Staff roles replaced and audited.
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/inventory-sources:
    get:
      tags:
        - Admin - Inventory Sources
      operationId: adminListInventorySources
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Page'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags:
        - Admin - Inventory Sources
      operationId: adminCreateInventorySource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventorySourceInput'
      responses:
        '201':
          $ref: '#/components/responses/Data'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/inventory-sources/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    get:
      tags:
        - Admin - Inventory Sources
      operationId: adminGetInventorySource
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags:
        - Admin - Inventory Sources
      operationId: adminUpdateInventorySource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventorySourcePatch'
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/inventory-sources/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    post:
      tags:
        - Admin - Inventory Sources
      operationId: adminActivateInventorySource
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Data'
  /api/v1/admin/inventory-sources/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    post:
      tags:
        - Admin - Inventory Sources
      operationId: adminDeactivateInventorySource
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Data'
  /api/v1/admin/inventory-sources/{id}/block:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    post:
      tags:
        - Admin - Inventory Sources
      operationId: adminBlockInventorySource
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Data'
  /api/v1/admin/inventory-sources/{id}/vehicles:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    get:
      tags:
        - Admin - Inventory Sources
      operationId: adminListSourceVehicles
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Data'
  /api/v1/admin/markets:
    get:
      tags:
        - Admin - Markets
      operationId: adminListMarkets
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/Page'
    post:
      tags:
        - Admin - Markets
      operationId: adminCreateMarket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketInput'
      responses:
        '201':
          $ref: '#/components/responses/Data'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/markets/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    get:
      tags:
        - Admin - Markets
      operationId: adminGetMarket
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Data'
    patch:
      tags:
        - Admin - Markets
      operationId: adminUpdateMarket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketPatch'
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/markets/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    post:
      tags:
        - Admin - Markets
      operationId: adminActivateMarket
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Data'
  /api/v1/admin/markets/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    post:
      tags:
        - Admin - Markets
      operationId: adminDeactivateMarket
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Data'
  /api/v1/admin/vehicles:
    get:
      tags:
        - Admin - Vehicles
      operationId: adminListVehicles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: availabilityStatus
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Page'
    post:
      tags:
        - Admin - Vehicles
      operationId: adminCreateVehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleInput'
      responses:
        '201':
          $ref: '#/components/responses/Data'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/vehicles/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    get:
      tags:
        - Admin - Vehicles
      operationId: adminGetVehicle
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags:
        - Admin - Vehicles
      operationId: adminUpdateVehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiclePatch'
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      tags:
        - Admin - Vehicles
      operationId: adminSoftDeleteVehicle
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Vehicle archived and soft deleted.
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/vehicles/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    post:
      tags:
        - Admin - Vehicles
      operationId: adminRestoreVehicle
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Data'
  /api/v1/admin/vehicles/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    post:
      tags:
        - Admin - Vehicles
      operationId: adminPublishVehicle
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/vehicles/{id}/unpublish:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    post:
      tags:
        - Admin - Vehicles
      operationId: adminUnpublishVehicle
      security:
        - bearerAuth: []
      responses:
        '200':
