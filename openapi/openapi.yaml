    get:
      tags:
        - Sales - Quotes
      operationId: downloadQuotePdf
      description: Requires quote.read_all or quote.read_assigned. Returns the current version's private customer-facing PDF; internal costing and notes are excluded.
      security:
        - bearerAuth: []
      parameters:
        - name: quoteRef
          in: path
          required: true
          schema:
            type: string
            pattern: ^Q-\d+$
      responses:
        '200':
          description: PDF document. Cache-Control is private, no-store.
          headers:
            X-Content-SHA256:
              schema:
                type: string
                pattern: ^[0-9a-f]{64}$
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags:
        - Sales - Quotes
      operationId: generateQuotePdf
      description: Requires quote.send and lead update access. Generates the current customer-safe quote PDF, stores it in the private database document table, and returns its digest and download path.
      security:
        - bearerAuth: []
      parameters:
        - name: quoteRef
          in: path
          required: true
          schema:
            type: string
            pattern: ^Q-\d+$
      responses:
        '201':
          description: PDF generated and stored.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [quoteReference, versionNo, sha256, downloadPath]
                    properties:
                      quoteReference:
                        type: string
                      versionNo:
                        type: integer
                      sha256:
                        type: string
                        pattern: ^[0-9a-f]{64}$
                      downloadPath:
                        type: string
        '404':
          $ref: '#/components/responses/Problem'
