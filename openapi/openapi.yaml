components:
  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: greenway_refresh_token
  responses:
    PublicVehicle:
      description: Published, available vehicle eligible for the selected destination market. Source and cost fields are absent.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                $ref: '#/components/schemas/PublicVehicle'
              meta:
                $ref: '#/components/schemas/RequestMeta'
    PublicVehicles:
      description: Market-eligible published and available vehicles.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/PublicVehicle'
              meta:
                type: object
                additionalProperties: true
    LeadReceipt:
      description: Guest Get Quote request recorded. Idempotent retry returns the same reference.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                $ref: '#/components/schemas/LeadReceipt'
              meta:
                $ref: '#/components/schemas/RequestMeta'
    Data:
      description: Permission-scoped data with request ID metadata.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataEnvelope'
    Page:
      description: Cursor-paginated permission-scoped collection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PageEnvelope'
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreateQuoteInput:
      type: object
      additionalProperties: false
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          example: PKR
    UpdateQuoteInput:
      type: object
      additionalProperties: false
      properties:
        validUntil:
          type:
            - string
            - 'null'
          format: date-time
    CreateQuoteVersionInput:
      type: object
      additionalProperties: false
      required:
        - validUntil
      properties:
        otherInternalCostMinor:
          type: integer
          minimum: 0
          default: 0
          description: Internal cost input in the quote currency's minor unit.
        markupBps:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
          description: Markup rate in basis points; amount is computed server-side.
        validUntil:
          type: string
          format: date-time
        terms:
          type:
            - string
            - 'null'
          maxLength: 8000
        customerNotes:
          type:
            - string
            - 'null'
          maxLength: 4000
        internalNotes:
          type:
            - string
            - 'null'
          maxLength: 4000
        items:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - kind
              - label
              - quantity
              - unitAmountMinor
            properties:
              kind:
                type: string
                enum:
                  - freight
                  - inspection
                  - insurance
                  - documentation
                  - service
                  - tax
                  - discount
                  - other
              label:
                type: string
                minLength: 1
                maxLength: 200
              quantity:
                type: integer
                minimum: 1
                maximum: 10000
              unitAmountMinor:
                type: integer
                description: Signed integer minor units; discounts are negative.
    QuoteReasonInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    CreateReservationInput:
      type: object
      additionalProperties: false
      required:
        - leadReferenceNo
      properties:
        leadReferenceNo:
          type: string
          pattern: ^LEAD-\d+$
        quoteReferenceNo:
          type: string
          pattern: ^Q-\d+$
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
    ExtendReservationInput:
      type: object
      additionalProperties: false
      required:
        - extendByHours
      properties:
        extendByHours:
          type: integer
          minimum: 1
          maximum: 168
    UpdateDealInput:
      type: object
      additionalProperties: false
      properties:
        internalNotes:
          type:
            - string
            - 'null'
          maxLength: 8000
        sourceConfirmationReference:
          type:
            - string
            - 'null'
          maxLength: 200
