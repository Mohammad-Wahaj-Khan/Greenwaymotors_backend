openapi: 3.1.0
info:
  title: Green Way Motors MVP API
  version: 1.0.0
  description: >-
    Deprecated marketplace draft. Do not implement its dealer endpoints or dealer fields.
    The current single-seller contract is backend/openapi/openapi.yaml and the source
    schema is backend/database/schema.sql.
servers:
  - url: https://api.greenwaymotors.com/api/v1
    description: Production
  - url: http://localhost:4000/api/v1
    description: Local
tags:
  - name: Auth
  - name: Reference
  - name: Vehicles
  - name: Leads
  - name: Customer
  - name: Dealer
  - name: Uploads
  - name: Staff CRM
  - name: Admin Dealers
  - name: Admin Vehicles
  - name: Admin Catalog
  - name: Admin RBAC
  - name: Audit
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: greenway_refresh_token
  schemas:
    Problem:
      type: object
      required:
        - title
        - status
        - requestId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
    CountrySummary:
      type: object
      required:
        - id
        - iso2
        - name
      properties:
        id:
          type: integer
        iso2:
          type: string
          minLength: 2
          maxLength: 2
        iso3:
          type: string
        name:
          type: string
        phoneCode:
          type:
            - string
            - 'null'
        region:
          type:
            - string
            - 'null'
    MakeSummary:
      type: object
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type:
            - string
            - 'null'
    ModelSummary:
      type: object
      required:
        - id
        - makeId
        - name
        - slug
      properties:
        id:
          type: integer
        makeId:
          type: integer
        name:
          type: string
        slug:
          type: string
    DealerSummary:
      type: object
      required:
        - id
        - companyName
        - slug
        - status
      properties:
        id:
          type: string
          format: uuid
        companyName:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - pending
            - under_review
            - verified
            - suspended
            - rejected
    Media:
      type: object
      required:
        - id
        - type
        - url
        - sortOrder
        - isPrimary
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - image
            - video
        url:
          type: string
        thumbUrl:
          type:
            - string
            - 'null'
        sortOrder:
          type: integer
        isPrimary:
          type: boolean
    VehicleCard:
      type: object
      required:
        - referenceNo
        - title
        - condition
        - year
        - make
        - model
        - stockCountry
        - dealer
      properties:
        referenceNo:
          type: string
        title:
          type: string
        condition:
          type: string
          enum:
            - new
            - used
        year:
          type: integer
        mileageKm:
          type:
            - integer
            - 'null'
        engineCc:
          type:
            - integer
            - 'null'
        fuel:
          type:
            - string
            - 'null'
        transmission:
          type:
            - string
            - 'null'
        drive:
          type:
            - string
            - 'null'
        steering:
          type:
            - string
            - 'null'
        make:
          $ref: '#/components/schemas/MakeSummary'
        model:
          $ref: '#/components/schemas/ModelSummary'
        stockCountry:
          $ref: '#/components/schemas/CountrySummary'
        dealer:
          $ref: '#/components/schemas/DealerSummary'
        primaryMedia:
          oneOf:
            - $ref: '#/components/schemas/Media'
            - type: 'null'
    VehicleDetail:
      allOf:
        - $ref: '#/components/schemas/VehicleCard'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            stockNumber:
              type:
                - string
                - 'null'
            vin:
              type:
                - string
                - 'null'
            variant:
              type:
                - string
                - 'null'
            seats:
              type:
                - integer
                - 'null'
            doors:
              type:
                - integer
                - 'null'
            exteriorColor:
              type:
                - string
                - 'null'
            interiorColor:
              type:
                - string
                - 'null'
            stockCity:
              type:
                - string
                - 'null'
            description:
              type:
                - string
                - 'null'
            media:
              type: array
              items:
                $ref: '#/components/schemas/Media'
            features:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  category:
                    type:
                      - string
                      - 'null'
    UserSummary:
      type: object
      required:
        - id
        - userType
        - email
        - fullName
        - status
      properties:
        id:
          type: string
          format: uuid
        userType:
          type: string
          enum:
            - customer
            - dealer_user
            - staff
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type:
            - string
            - 'null'
        whatsapp:
          type:
            - string
            - 'null'
        country:
          oneOf:
            - $ref: '#/components/schemas/CountrySummary'
            - type: 'null'
        city:
          type:
            - string
            - 'null'
        preferredContact:
          type:
            - string
            - 'null'
          enum:
            - email
            - phone
            - whatsapp
            - null
        status:
          type: string
          enum:
            - active
            - suspended
            - deleted
        emailVerifiedAt:
          type:
            - string
            - 'null'
          format: date-time
    LeadSummary:
      type: object
      required:
        - referenceNo
        - status
        - contactName
        - contactEmail
        - vehicleSnapshot
        - createdAt
      properties:
        referenceNo:
          type: string
        status:
          type: string
          enum:
            - new
            - contacted
            - quote_sent
            - negotiating
            - won
            - lost
            - spam
        contactName:
          type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type:
            - string
            - 'null'
        contactWhatsapp:
          type:
            - string
            - 'null'
        customerCountry:
          oneOf:
            - $ref: '#/components/schemas/CountrySummary'
            - type: 'null'
        destinationCountry:
          oneOf:
            - $ref: '#/components/schemas/CountrySummary'
            - type: 'null'
        destinationPort:
          type:
            - string
            - 'null'
        vehicleSnapshot:
          type: object
          additionalProperties: true
        assignedTo:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
    RegisterCustomerInput:
      type: object
      required:
        - email
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        fullName:
          type: string
        phone:
          type: string
        whatsapp:
          type: string
        countryId:
          type: integer
        city:
          type: string
        preferredContact:
          type: string
          enum:
            - email
            - phone
            - whatsapp
    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    CreateLeadInput:
      type: object
      required:
        - vehicleReferenceNo
        - contactName
        - contactEmail
        - consentGiven
      properties:
        vehicleReferenceNo:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        contactWhatsapp:
          type: string
        preferredContact:
          type: string
          enum:
            - email
            - phone
            - whatsapp
        customerCountryId:
          type: integer
        destinationCountryId:
          type: integer
        destinationPort:
          type: string
        message:
          type: string
          maxLength: 5000
        consentGiven:
          type: boolean
          const: true
    SavedSearchInput:
      type: object
      required:
        - filters
      properties:
        name:
          type:
            - string
            - 'null'
        filters:
          type: object
          additionalProperties: true
        notify:
          type: boolean
          default: true
    CreateVehicleInput:
      type: object
      required:
        - makeId
        - modelId
        - year
        - stockCountryId
        - title
      properties:
        stockNumber:
          type: string
        vin:
          type: string
        condition:
          type: string
          enum:
            - new
            - used
        makeId:
          type: integer
        modelId:
          type: integer
        variant:
          type: string
        bodyTypeId:
          type: integer
        year:
          type: integer
          minimum: 1950
          maximum: 2100
        mileageKm:
          type: integer
          minimum: 0
        engineCc:
          type: integer
          minimum: 0
        fuel:
          type: string
        transmission:
          type: string
        drive:
          type: string
        steering:
          type: string
        seats:
          type: integer
        doors:
          type: integer
        exteriorColor:
          type: string
        interiorColor:
          type: string
        stockCountryId:
          type: integer
        stockCity:
          type: string
        title:
          type: string
        description:
          type: string
    AssignLeadInput:
      type: object
      required:
        - assignedTo
      properties:
        assignedTo:
          type: string
          format: uuid
    LeadStatusInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - new
            - contacted
            - quote_sent
            - negotiating
            - won
            - lost
            - spam
        lostReason:
          type:
            - string
            - 'null'
    LeadActivityInput:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - note
            - call
            - email
            - whatsapp
        body:
          type: string
          maxLength: 10000
    FollowupInput:
      type: object
      required:
        - dueAt
      properties:
        assignedTo:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
        note:
          type: string
    DealerStatusInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - under_review
            - verified
            - suspended
            - rejected
        reason:
          type:
            - string
            - 'null'
    DocumentReviewInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - approved
            - rejected
        notes:
          type:
            - string
            - 'null'
paths:
  /auth/customers/register:
    post:
      tags:
        - Auth
      summary: Register customer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerInput'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserSummary'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate refresh session
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout current session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/logout-all:
    post:
      tags:
        - Auth
      summary: Logout all sessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/email-verification/request:
    post:
      tags:
        - Auth
      summary: Request email verification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/email-verification/confirm:
    post:
      tags:
        - Auth
      summary: Confirm email verification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/password/forgot:
    post:
      tags:
        - Auth
      summary: Request password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/password/reset:
    post:
      tags:
        - Auth
      summary: Reset password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserSummary'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
        - Auth
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fullName:
                  type: string
                phone:
                  type:
                    - string
                    - 'null'
                whatsapp:
                  type:
                    - string
                    - 'null'
                countryId:
                  type:
                    - integer
                    - 'null'
                city:
                  type:
                    - string
                    - 'null'
                preferredContact:
                  type:
                    - string
                    - 'null'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /countries:
    get:
      tags:
        - Reference
      summary: List active countries
      security: []
      parameters:
        - name: region
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CountrySummary'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /catalog/makes:
    get:
      tags:
        - Reference
      summary: List active makes
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MakeSummary'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
